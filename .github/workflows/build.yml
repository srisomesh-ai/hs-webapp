name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Download it from Firebase Console (project hamaraservice-s009, Android app com.hamaraservice.app) and commit it to app/google-services.json"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HamaraService.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamaraService-APK
          path: HamaraService.apk
